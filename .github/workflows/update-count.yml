name: Update Data

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (for update script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout gh-pages (site files to update)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Fetch and write data files
        run: |
          python3 main-repo/scripts/update-data.py gh-pages-repo
          python3 main-repo/scripts/update-news.py gh-pages-repo

      - name: Commit and push changes
        working-directory: gh-pages-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signature-count.json polling-snapshot.json news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update petition and news data"
            git push
          fi
