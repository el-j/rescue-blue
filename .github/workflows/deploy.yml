name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Restore current signature count from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          COUNT=$(git show origin/gh-pages:signature-count.json 2>/dev/null \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',''))" 2>/dev/null \
            || echo "")
          if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "{\"count\":$COUNT}" > dist/signature-count.json
            echo "Preserved live signature count: $COUNT"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
