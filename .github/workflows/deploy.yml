name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Restore live data files from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          for file in signature-count.json polling-snapshot.json; do
            content=$(git show "origin/gh-pages:$file" 2>/dev/null || echo "")
            if [ -n "$content" ]; then
              printf '%s' "$content" > "dist/$file"
              echo "Preserved $file from gh-pages"
            fi
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
